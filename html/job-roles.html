<head>

    <title>Explore Job Roles | Career Compass AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5f2;
            color: #443846;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 76px;
            background: white;
            border-bottom: 1px solid #ebe5e3;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .brand {
            text-decoration: none;
            color: #443846;
            font-size: 24px;
            font-weight: bold;
        }

        .brand span {
            color: #e998b3;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #756d76;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #e998b3;
        }

        /* ================= MAIN ================= */

        .page {
            width: min(1200px, 90%);
            margin: auto;
            padding: 55px 0 80px;
        }

        /* ================= HERO ================= */

        .hero {
            text-align: center;
            max-width: 760px;
            margin: auto auto 40px;
        }

        .small-label {
            display: inline-block;
            background: #f4e4ea;
            color: #805269;
            padding: 9px 17px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-family: Georgia, serif;
            font-size: 46px;
            margin: 0 0 15px;
        }

        .hero h1 span {
            color: #e998b3;
        }

        .hero p {
            color: #756d76;
            line-height: 1.7;
            margin: 0;
        }

        /* ================= SEARCH ================= */

        .search-box {
            max-width: 750px;
            margin: 35px auto 25px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .search-box input {
            width: 100%;
            padding: 18px 22px 18px 52px;
            border: 1px solid #ddd5d7;
            border-radius: 30px;
            outline: none;
            font-size: 15px;
            background: white;
            color: #443846;
        }

        .search-box input:focus {
            border-color: #e998b3;
        }

        /* ================= FILTERS ================= */

        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 45px;
        }

        .filter-btn {
            border: 1px solid #ddd5d7;
            background: white;
            color: #756d76;
            padding: 11px 17px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #443846;
            color: white;
            border-color: #443846;
        }

        /* ================= RESULTS INFO ================= */

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .results-info h2 {
            font-family: Georgia, serif;
            font-size: 30px;
            margin: 0;
        }

        .results-count {
            color: #756d76;
            font-size: 14px;
        }

        /* ================= JOB GRID ================= */

        .job-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .job-card {
            background: white;
            border: 1px solid #ebe5e3;
            border-radius: 25px;
            padding: 24px;
            transition: 0.25s;
        }

        .job-card:hover {
            transform: translateY(-5px);
            border-color: #e998b3;
            box-shadow: 0 15px 35px rgba(68, 56, 70, 0.08);
        }

        .job-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .job-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: #f4e4ea;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        .sector-badge {
            background: #faf5f7;
            color: #c46d8c;
            padding: 7px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .job-card h3 {
            font-size: 21px;
            margin: 20px 0 9px;
        }

        .job-card p {
            color: #756d76;
            font-size: 14px;
            line-height: 1.6;
            min-height: 65px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin: 18px 0;
        }

        .skill {
            background: #f7f5f2;
            color: #756d76;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
        }

        .job-actions {
            display: flex;
            gap: 10px;
        }

        .details-btn {
            flex: 1;
            border: none;
            background: #443846;
            color: white;
            padding: 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .details-btn:hover {
            background: #e998b3;
        }

        .save-btn {
            width: 46px;
            border: none;
            background: #f4e4ea;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        .save-btn.saved {
            background: #e998b3;
            color: white;
        }

        /* ================= NO RESULTS ================= */

        .no-results {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: #756d76;
        }

        .no-results h3 {
            font-family: Georgia, serif;
            color: #443846;
            font-size: 25px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 950px) {

            .job-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .navbar {
                padding: 0 5%;
            }

            .nav-links a:last-child {
                display: none;
            }

            .page {
                padding-top: 40px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .job-grid {
                grid-template-columns: 1fr;
            }

            .results-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 7px;
            }

        }

    </style>
</head>

        /* =========================================
           DISPLAY CAREERS
        ========================================= */

        function displayCareers() {

            const searchValue =
                searchInput.value
                .toLowerCase()
                .trim();


            const filteredCareers =
                careers.filter(function(career) {

                    const sectorMatch =
                        activeSector === "all" ||
                        career.sector === activeSector;


                    const searchableText =
                        (
                            career.name + " " +
                            career.sector + " " +
                            career.description + " " +
                            career.skills.join(" ")
                        )
                        .toLowerCase();


                    const searchMatch =
                        searchableText.includes(
                            searchValue
                        );


                    return sectorMatch && searchMatch;

                });


            jobGrid.innerHTML = "";


            sectionTitle.textContent =
                sectorNames[activeSector];


            resultsCount.textContent =
                filteredCareers.length +
                " roles found";


            if (filteredCareers.length === 0) {

                jobGrid.style.display =
                    "none";

                noResults.style.display =
                    "block";

                return;

            }


            jobGrid.style.display =
                "grid";

            noResults.style.display =
                "none";


            filteredCareers.forEach(
                function(career) {


                    const skillsHTML =
                        career.skills.map(
                            function(skill) {

                                    '</span>'
                                );

                            }
                        ).join("");

                        sectorNames[career.sector]
                        .replace(" Roles", "")
                        .replace(" Role", "");

                        document.createElement("article");


                    card.className =
                        "job-card";


                    card.innerHTML =

                        '<div class="job-top">' +

                        '<div class="job-icon">' +
                        career.icon +
                        '</div>' +

                        '<div class="sector-badge">' +
                        sectorLabel +
                        '</div>' +

                        '</div>' +

                        '<h3>' +
                        career.name +
                        '</h3>' +

                        '<p>' +
                        career.description +
                        '</p>' +

                        '<div class="skills">' +
                        skillsHTML +
                        '</div>' +

                        '<div class="job-actions">' +

                        '<button class="details-btn" onclick="viewDetails(' +
                        '\'' +
                        career.name.replace(/'/g, "\\'") +
                        '\'' +
                        ')">' +

                        'View Details →' +

                        '</button>' +

                        '<button class="save-btn" onclick="saveCareer(this, ' +
                        '\'' +
                        career.name.replace(/'/g, "\\'") +
                        '\'' +
                        ')">' +

                        '♡' +

                        '</button>' +

                        '</div>';


                    jobGrid.appendChild(card);

                }
            );

        }


        /* =========================================
           FILTER BUTTONS
        ========================================= */

        filterButtons.forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        activeSector =
                            button.dataset.sector;


                        localStorage.setItem(
                            "selectedSector",
                            activeSector
                        );


                        filterButtons.forEach(
                            function(item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                        button.classList.add(
                            "active"
                        );


                        displayCareers();

                    }
                );

            }
        );


        /* =========================================
           SET ACTIVE FILTER ON PAGE LOAD
        ========================================= */

        function setActiveFilter() {

            filterButtons.forEach(
                function(button) {

                    if (
                        button.dataset.sector ===
                        activeSector
                    ) {

                        button.classList.add(
                            "active"
                        );

                    } else {

                        button.classList.remove(
                            "active"
                        );

                    }

                }
            );

        }


        /* =========================================
           SEARCH
        ========================================= */

        searchInput.addEventListener(
            "input",
            function() {

                displayCareers();

            }
        );


        /* =========================================
           VIEW DETAILS
        ========================================= */

        function viewDetails(careerName) {

            localStorage.setItem(
                "selectedCareer",
                careerName
            );


            window.location.href =
                "./job-role-detail.html";

        }


        /* =========================================
           SAVE CAREER
        ========================================= */

        function saveCareer(button, careerName) {

            let savedCareers =
                JSON.parse(
                    localStorage.getItem("savedCareers")
                ) || [];


            if (
                savedCareers.includes(
                    careerName
                )
            ) {

                savedCareers =
                    savedCareers.filter(
                        function(name) {

                            return name !== careerName;

                        }
                    );


                button.textContent =
                    "♡";

                button.classList.remove(
                    "saved"
                );

            } else {

                savedCareers.push(
                    careerName
                );


                button.textContent =
                    "♥";

                button.classList.add(
                    "saved"
                );

            }


            localStorage.setItem(
                "savedCareers",
                JSON.stringify(savedCareers)
            );

        }


        /* =========================================
           INITIAL LOAD
        ========================================= */

        setActiveFilter();

        displayCareers();

    </script>

</body>

</html>
