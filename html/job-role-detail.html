<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Details | Career Compass AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5f2;
            color: #443846;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            height: 76px;
            background: white;
            border-bottom: 1px solid #ebe5e3;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .brand {
            text-decoration: none;
            color: #443846;
            font-size: 24px;
            font-weight: bold;
        }

        .brand span {
            color: #e998b3;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #756d76;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #e998b3;
        }


        /* ================= MAIN ================= */

        .page {
            width: min(1150px, 90%);
            margin: auto;
            padding: 45px 0 80px;
        }


        /* ================= BACK BUTTON ================= */

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #756d76;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            color: #e998b3;
        }


        /* ================= HERO ================= */

        .career-hero {
            background: white;
            border: 1px solid #ebe5e3;
            border-radius: 30px;

            padding: 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;

            margin-bottom: 25px;
        }

        .career-info {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .career-icon {
            width: 100px;
            height: 100px;

            background: #f4e4ea;

            border-radius: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 52px;
        }

        .sector-label {
            display: inline-block;

            background: #faf5f7;
            color: #c46d8c;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: bold;

            margin-bottom: 12px;
        }

        .career-info h1 {
            font-family: Georgia, serif;
            font-size: 42px;
            margin: 0 0 10px;
        }

        .career-info p {
            color: #756d76;
            margin: 0;
            line-height: 1.6;
        }

        .hero-actions {
            display: flex;
            gap: 10px;
        }

        .save-btn,
        .compare-btn {
            border: none;
            padding: 14px 20px;
            border-radius: 22px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn {
            background: #443846;
            color: white;
        }

        .save-btn:hover {
            background: #e998b3;
        }

        .save-btn.saved {
            background: #e998b3;
        }

        .compare-btn {
            background: #f4e4ea;
            color: #805269;
        }

        .compare-btn:hover {
            background: #e998b3;
            color: white;
        }


        /* ================= GRID ================= */

        .details-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }


        /* ================= CARDS ================= */

        .card {
            background: white;
            border: 1px solid #ebe5e3;
            border-radius: 26px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .card h2 {
            font-family: Georgia, serif;
            font-size: 27px;
            margin-top: 0;
            margin-bottom: 16px;
        }

        .card p {
            color: #756d76;
            line-height: 1.8;
            font-size: 15px;
        }


        /* ================= RESPONSIBILITIES ================= */

        .responsibility-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .responsibility-list li {
            padding: 14px 0;
            border-bottom: 1px solid #eee8e8;
            color: #756d76;
            line-height: 1.5;
        }

        .responsibility-list li:last-child {
            border-bottom: none;
        }

        .responsibility-list li::before {
            content: "✦";
            color: #e998b3;
            margin-right: 12px;
        }


        /* ================= SKILLS ================= */

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-tag {
            background: #f4e4ea;
            color: #805269;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }


        /* ================= SIDEBAR ================= */

        .side-card {
            background: white;
            border: 1px solid #ebe5e3;
            border-radius: 26px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .side-card h3 {
            font-family: Georgia, serif;
            font-size: 21px;
            margin-top: 0;
        }

        .info-item {
            padding: 15px 0;
            border-bottom: 1px solid #eee8e8;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #9a9198;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .info-value {
            color: #443846;
            font-size: 14px;
            font-weight: bold;
        }


        /* ================= EDUCATION ================= */

        .education-step {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .step-number {
            min-width: 35px;
            height: 35px;

            background: #f4e4ea;
            color: #805269;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        .education-step h4 {
            margin: 0 0 5px;
            font-size: 15px;
        }

        .education-step p {
            margin: 0;
            font-size: 13px;
        }


        /* ================= OPPORTUNITIES ================= */

        .opportunity {
            padding: 13px 15px;
            background: #f7f5f2;
            border-radius: 15px;
            margin-bottom: 10px;
            color: #756d76;
            font-size: 14px;
        }


        /* ================= EMPTY STATE ================= */

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 30px;
            border: 1px solid #ebe5e3;
        }

        .empty-state h1 {
            font-family: Georgia, serif;
        }

        .empty-state a {
            display: inline-block;
            margin-top: 15px;
            background: #443846;
            color: white;
            text-decoration: none;
            padding: 14px 22px;
            border-radius: 22px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .details-grid {
                grid-template-columns: 1fr;
            }

            .career-hero {
                align-items: flex-start;
                flex-direction: column;
            }

        }

        @media (max-width: 650px) {

            .navbar {
                padding: 0 5%;
            }

            .nav-links a:last-child {
                display: none;
            }

            .career-info {
                align-items: flex-start;
                flex-direction: column;
            }

            .career-info h1 {
                font-size: 34px;
            }

            .hero-actions {
                width: 100%;
                flex-direction: column;
            }

            .save-btn,
            .compare-btn {
                width: 100%;
            }

            .card {
                padding: 22px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <a href="./index.html" class="brand">
            Career Compass <span>AI ✦</span>
        </a>

        <div class="nav-links">

            <a href="./results.html">
                My Results
            </a>

            <a href="./sectors.html">
                Explore
            </a>

            <a href="./dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>



    <main class="page">


        <!-- BACK BUTTON -->

        <a href="./job-roles.html" class="back-btn">
            ← Back to Job Roles
        </a>


        <!-- ================= CAREER CONTENT ================= -->

        <div id="careerContent">

            <!-- JavaScript will add career details here -->

        </div>


    </main>



<script>

    /* =====================================================
       CAREER DETAIL — 500 CAREER DATABASE
    ===================================================== */

    const selectedCareer =
        localStorage.getItem("selectedCareer");

    const careerContent =
        document.getElementById("careerContent");


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =====================================================
       CONVERT DATABASE TEXT INTO LIST
    ===================================================== */

    function toList(value) {

        if (!value) {
            return [];
        }

        if (Array.isArray(value)) {
            return value;
        }

        return String(value)
            .split(/\n|;|\||,/)
            .map(function(item) {
                return item.trim();
            })
            .filter(function(item) {
                return item.length > 0;
            });
    }


    /* =====================================================
       LIST HTML
    ===================================================== */

    function createList(items) {

        if (!items || items.length === 0) {
            return "<p>No information available.</p>";
        }

        return items.map(function(item) {

            return (
                '<div class="opportunity">' +
                "→ " +
                escapeHTML(item) +
                "</div>"
            );

        }).join("");
    }


    /* =====================================================
       SKILLS HTML
    ===================================================== */

    function createSkills(items) {

        if (!items || items.length === 0) {
            return "<p>No skills listed.</p>";
        }

        return items.map(function(item) {

            return (
                '<span class="skill-tag">' +
                escapeHTML(item) +
                "</span>"
            );

        }).join("");
    }


    /* =====================================================
       LOAD SAVED CAREERS
    ===================================================== */

    async function getSavedCareers() {

        try {

            const response =
                await fetch("/api/saved-careers");

            const data =
                await response.json();

            if (
                data.success &&
                Array.isArray(data.savedCareers)
            ) {

                return data.savedCareers;

            }

        } catch (error) {

            console.error(
                "Unable to load saved careers:",
                error
            );

        }

        return [];
    }


    /* =====================================================
       SAVE CAREER
    ===================================================== */

    async function saveCareer(career) {

        const button =
            document.getElementById("saveButton");

        try {

            const response =
                await fetch("/api/save-career", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

     body: JSON.stringify({

                careerTitle:
                    career.careerTitle,

                onetSocCode:
                    career.onetSocCode || "",

                matchPercentage:
                    parseInt(
                        localStorage.getItem(
                            "selectedCareerMatch"
                        )
                    ) || 0

            })
                });

            const data =
                await response.json();

            if (data.success) {

                button.textContent =
                    "♥ Saved";

                button.classList.add("saved");

                return;

            }

            alert(
                data.message ||
                "Unable to save career."
            );

        } catch (error) {

            console.error(
                "Save career error:",
                error
            );

            alert(
                "Unable to save career."
            );

        }

    }


    /* =====================================================
       REMOVE CAREER
    ===================================================== */

    async function removeCareer(career) {

        const button =
            document.getElementById("saveButton");

        try {

            const response =
                await fetch(
                    "/api/remove-career",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            career_title:
                                career.careerTitle

                        })

                    }
                );

            const data =
                await response.json();

            if (data.success) {

                button.textContent =
                    "♡ Save";

                button.classList.remove(
                    "saved"
                );

                return;

            }

            alert(
                data.message ||
                "Unable to remove career."
            );

        } catch (error) {

            console.error(
                "Remove career error:",
                error
            );

            alert(
                "Unable to remove career."
            );

        }

    }


    /* =====================================================
       LOAD CAREER CATALOG
    ===================================================== */

    async function loadCareerDetails() {

        if (!selectedCareer) {

            careerContent.innerHTML =

                '<section class="empty-state">' +

                '<div style="font-size:55px;">🧭</div>' +

                '<h1>No career selected</h1>' +

                '<p>' +
                'Please explore career roles and ' +
                'select a career first.' +
                '</p>' +

                '<a href="./roles.html">' +
                'Explore Career Roles' +
                '</a>' +

                '</section>';

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/career-catalog"
                );


            const data =
                await response.json();


            if (
                !data.success ||
                !Array.isArray(data.careers)
            ) {

                throw new Error(
                    "Career catalog could not be loaded."
                );

            }


            /* =================================================
               FIND SELECTED CAREER
            ================================================= */

            const career =
                data.careers.find(
                    function(item) {

                        return (
                            String(
                                item.careerTitle
                            ).toLowerCase() ===
                            String(
                                selectedCareer
                            ).toLowerCase()
                        );

                    }
                );


            if (!career) {

                careerContent.innerHTML =

                    '<section class="empty-state">' +

                    '<div style="font-size:55px;">🔎</div>' +

                    '<h1>Career not found</h1>' +

                    '<p>' +
                    'We could not find this career in ' +
                    'the career catalog.' +
                    '</p>' +

                    '<a href="./roles.html">' +
                    'Back to Career Roles' +
                    '</a>' +

                    '</section>';

                return;
            }


            /* =================================================
               PREPARE DATA
            ================================================= */

            const skills =
                toList(
                    career.importantSkills
                );

            const courses =
                toList(
                    career.recommendedCourses
                );

            const jobRoles =
                toList(
                    career.commonJobRoles
                );

            const roadmap =
                toList(
                    career.careerRoadmap
                );


            document.title =
                career.careerTitle +
                " | Career Compass AI";


            /* =================================================
               SAVED STATUS
            ================================================= */

            const savedCareers =
                await getSavedCareers();


            const isSaved =
                savedCareers.some(
                    function(item) {

                        const title =
                            item.career_title ||
                            item.careerTitle ||
                            item.title ||
                            "";

                        return (
                            String(title).toLowerCase() ===
                            String(
                                career.careerTitle
                            ).toLowerCase()
                        );

                    }
                );


            /* =================================================
               ROADMAP HTML
            ================================================= */

            let roadmapHTML = "";


            if (roadmap.length > 0) {

                roadmapHTML =
                    roadmap.map(
                        function(step, index) {

                            return (

                                '<div class="education-step">' +

                                '<div class="step-number">' +
                                (index + 1) +
                                '</div>' +

                                '<div>' +

                                '<h4>' +
                                "Step " +
                                (index + 1) +
                                '</h4>' +

                                '<p>' +
                                escapeHTML(step) +
                                '</p>' +

                                '</div>' +

                                '</div>'

                            );

                        }
                    ).join("");

            } else {

                roadmapHTML =
                    "<p>No career roadmap available.</p>";

            }


            /* =================================================
               BUILD PAGE
            ================================================= */

            careerContent.innerHTML =

                '<section class="career-hero">' +

                    '<div class="career-info">' +

                        '<div class="career-icon">' +
                            "💼" +
                        '</div>' +

                        '<div>' +

                            '<div class="sector-label">' +
                                escapeHTML(
                                    career.sector
                                ) +
                            '</div>' +

                            '<h1>' +
                                escapeHTML(
                                    career.careerTitle
                                ) +
                            '</h1>' +

                            '<p>' +
                                escapeHTML(
                                    career.shortDescription
                                ) +
                            '</p>' +

                        '</div>' +

                    '</div>' +


                    '<div class="hero-actions">' +

                        '<button ' +
                            'id="saveButton" ' +
                            'class="save-btn ' +
                            (isSaved ? "saved" : "") +
                            '">' +

                            (
                                isSaved
                                    ? "♥ Saved"
                                    : "♡ Save"
                            ) +

                        '</button>' +


                        '<button ' +
                            'class="compare-btn" ' +
                            'id="compareButton">' +

                            '⇄ Compare' +

                        '</button>' +

                    '</div>' +

                '</section>' +


                '<div class="details-grid">' +


                    /* =========================================
                       LEFT COLUMN
                    ========================================= */

                    '<div>' +


                        /* OVERVIEW */

                        '<section class="card">' +

                            '<h2>Career Overview</h2>' +

                            '<p>' +
                                escapeHTML(
                                    career.shortDescription
                                ) +
                            '</p>' +

                        '</section>' +


                        /* SKILLS */

                        '<section class="card">' +

                            '<h2>Important Skills</h2>' +

                            '<div class="skills-container">' +

                                createSkills(skills) +

                            '</div>' +

                        '</section>' +


                        /* EDUCATION */

                        '<section class="card">' +

                            '<h2>Education & Qualification</h2>' +

                            '<p>' +
                                escapeHTML(
                                    career.educationQualification
                                ) +
                            '</p>' +

                        '</section>' +


                        /* COURSES */

                        '<section class="card">' +

                            '<h2>Recommended Courses & Certifications</h2>' +

                            '<div>' +

                                createList(courses) +

                            '</div>' +

                        '</section>' +


                        /* ROADMAP */

                        '<section class="card">' +

                            '<h2>Career Roadmap</h2>' +

                            roadmapHTML +

                        '</section>' +


                        /* JOB OPPORTUNITIES */

                        '<section class="card">' +

                            '<h2>Common Job Roles & Opportunities</h2>' +

                            createList(jobRoles) +

                        '</section>' +


                        /* CAREER GROWTH */

                        '<section class="card">' +

                            '<h2>Career Growth</h2>' +

                            '<p>' +
                                escapeHTML(
                                    career.careerGrowth
                                ) +
                            '</p>' +

                        '</section>' +


                    '</div>' +


                    /* =========================================
                       RIGHT COLUMN
                    ========================================= */

                    '<aside>' +


                        '<section class="side-card">' +

                            '<h3>Career Snapshot</h3>' +


                            '<div class="info-item">' +

                                '<div class="info-label">' +
                                    'SECTOR / INDUSTRY' +
                                '</div>' +

                                '<div class="info-value">' +
                                    escapeHTML(
                                        career.sector
                                    ) +
                                '</div>' +

                            '</div>' +


                            '<div class="info-item">' +

                                '<div class="info-label">' +
                                    'SALARY RANGE' +
                                '</div>' +

                                '<div class="info-value">' +
                                    escapeHTML(
                                        career.salaryRange
                                    ) +
                                '</div>' +

                            '</div>' +


                            '<div class="info-item">' +

                                '<div class="info-label">' +
                                    'DEMAND LEVEL' +
                                '</div>' +

                                '<div class="info-value">' +
                                    escapeHTML(
                                        career.demandLevel
                                    ) +
                                '</div>' +

                            '</div>' +


                            '<div class="info-item">' +

                                '<div class="info-label">' +
                                    'O*NET-SOC CODE' +
                                '</div>' +

                                '<div class="info-value">' +
                                    escapeHTML(
                                        career.onetSocCode
                                    ) +
                                '</div>' +

                            '</div>' +


                        '</section>' +


                    '</aside>' +


                '</div>';


            /* =================================================
               SAVE / REMOVE BUTTON
            ================================================= */

            document
                .getElementById("saveButton")
                .addEventListener(
                    "click",
                    async function() {

                        if (
                            this.classList.contains(
                                "saved"
                            )
                        ) {

                            await removeCareer(
                                career
                            );

                        } else {

                            await saveCareer(
                                career
                            );

                        }

                    }
                );


            /* =================================================
               COMPARE BUTTON
            ================================================= */

            document
                .getElementById("compareButton")
                .addEventListener(
                    "click",
                    function() {

                        localStorage.setItem(
                            "careerToCompare",
                            career.careerTitle
                        );

                        window.location.href =
                            "./compare.html";

                    }
                );


        } catch (error) {

            console.error(
                "Career detail error:",
                error
            );


            careerContent.innerHTML =

                '<section class="empty-state">' +

                '<div style="font-size:55px;">⚠️</div>' +

                '<h1>Unable to load career</h1>' +

                '<p>' +
                'There was a problem loading the career information.' +
                '</p>' +

                '<a href="./roles.html">' +
                'Back to Career Roles' +
                '</a>' +

                '</section>';

        }

    }


    /* =====================================================
       START
    ===================================================== */

    loadCareerDetails();

</script>

</body>
</html>
