<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Details | Career Compass AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5f2;
            color: #443846;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            height: 76px;
            background: white;
            border-bottom: 1px solid #ebe5e3;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .brand {
            text-decoration: none;
            color: #443846;
            font-size: 24px;
            font-weight: bold;
        }

        .brand span {
            color: #e998b3;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #756d76;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #e998b3;
        }


        /* ================= MAIN ================= */

        .page {
            width: min(1150px, 90%);
            margin: auto;
            padding: 45px 0 80px;
        }


        /* ================= BACK BUTTON ================= */

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #756d76;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            color: #e998b3;
        }


        /* ================= HERO ================= */

        .career-hero {
            background: white;
            border: 1px solid #ebe5e3;
            border-radius: 30px;

            padding: 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;

            margin-bottom: 25px;
        }

        .career-info {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .career-icon {
            width: 100px;
            height: 100px;

            background: #f4e4ea;

            border-radius: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 52px;
        }

        .sector-label {
            display: inline-block;

            background: #faf5f7;
            color: #c46d8c;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: bold;

            margin-bottom: 12px;
        }

        .career-info h1 {
            font-family: Georgia, serif;
            font-size: 42px;
            margin: 0 0 10px;
        }

        .career-info p {
            color: #756d76;
            margin: 0;
            line-height: 1.6;
        }

        .hero-actions {
            display: flex;
            gap: 10px;
        }

        .save-btn,
        .compare-btn {
            border: none;
            padding: 14px 20px;
            border-radius: 22px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn {
            background: #443846;
            color: white;
        }

        .save-btn:hover {
            background: #e998b3;
        }

        .save-btn.saved {
            background: #e998b3;
        }

        .compare-btn {
            background: #f4e4ea;
            color: #805269;
        }

        .compare-btn:hover {
            background: #e998b3;
            color: white;
        }


        /* ================= GRID ================= */

        .details-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }


        /* ================= CARDS ================= */

        .card {
            background: white;
            border: 1px solid #ebe5e3;
            border-radius: 26px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .card h2 {
            font-family: Georgia, serif;
            font-size: 27px;
            margin-top: 0;
            margin-bottom: 16px;
        }

        .card p {
            color: #756d76;
            line-height: 1.8;
            font-size: 15px;
        }


        /* ================= RESPONSIBILITIES ================= */

        .responsibility-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .responsibility-list li {
            padding: 14px 0;
            border-bottom: 1px solid #eee8e8;
            color: #756d76;
            line-height: 1.5;
        }

        .responsibility-list li:last-child {
            border-bottom: none;
        }

        .responsibility-list li::before {
            content: "✦";
            color: #e998b3;
            margin-right: 12px;
        }


        /* ================= SKILLS ================= */

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-tag {
            background: #f4e4ea;
            color: #805269;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }


        /* ================= SIDEBAR ================= */

        .side-card {
            background: white;
            border: 1px solid #ebe5e3;
            border-radius: 26px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .side-card h3 {
            font-family: Georgia, serif;
            font-size: 21px;
            margin-top: 0;
        }

        .info-item {
            padding: 15px 0;
            border-bottom: 1px solid #eee8e8;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #9a9198;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .info-value {
            color: #443846;
            font-size: 14px;
            font-weight: bold;
        }


        /* ================= EDUCATION ================= */

        .education-step {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .step-number {
            min-width: 35px;
            height: 35px;

            background: #f4e4ea;
            color: #805269;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        .education-step h4 {
            margin: 0 0 5px;
            font-size: 15px;
        }

        .education-step p {
            margin: 0;
            font-size: 13px;
        }


        /* ================= OPPORTUNITIES ================= */

        .opportunity {
            padding: 13px 15px;
            background: #f7f5f2;
            border-radius: 15px;
            margin-bottom: 10px;
            color: #756d76;
            font-size: 14px;
        }


        /* ================= EMPTY STATE ================= */

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 30px;
            border: 1px solid #ebe5e3;
        }

        .empty-state h1 {
            font-family: Georgia, serif;
        }

        .empty-state a {
            display: inline-block;
            margin-top: 15px;
            background: #443846;
            color: white;
            text-decoration: none;
            padding: 14px 22px;
            border-radius: 22px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .details-grid {
                grid-template-columns: 1fr;
            }

            .career-hero {
                align-items: flex-start;
                flex-direction: column;
            }

        }

        @media (max-width: 650px) {

            .navbar {
                padding: 0 5%;
            }

            .nav-links a:last-child {
                display: none;
            }

            .career-info {
                align-items: flex-start;
                flex-direction: column;
            }

            .career-info h1 {
                font-size: 34px;
            }

            .hero-actions {
                width: 100%;
                flex-direction: column;
            }

            .save-btn,
            .compare-btn {
                width: 100%;
            }

            .card {
                padding: 22px;
            }

        }

    </style>

</head>

            encodeURIComponent(selectedCareer)
        );

            backendCareer = result.career;

            console.log(
                "Career loaded from backend:",
                backendCareer
            );

        } else {

            console.log(
                "Backend career not found:",
                result.message
            );

        }

    } catch (error) {

        console.error(
            "Career backend error:",
            error
        );

    }
}

/* =========================================
   SAVE CAREER - BACKEND
========================================= */

document
    .getElementById("saveButton")
    .addEventListener(
        "click",
        async function() {

            const button = this;

            try {

                const isCurrentlySaved =
                    button.classList.contains("saved");

                if (isCurrentlySaved) {

                    // REMOVE FROM DATABASE
                    const response = await fetch(
                        "/api/remove-career",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                careerTitle:
                                    selectedCareer
                            })
                        }
                    );

                    const result =
                        await response.json();

                    if (!result.success) {

                        alert(
                            result.message ||
                            "Unable to remove career."
                        );

                        return;
                    }

                    button.textContent = "♡ Save";

                    button.classList.remove("saved");

                } else {

                    // SAVE TO DATABASE
                    const response = await fetch(
                        "/api/save-career",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                careerTitle:
                                    selectedCareer,

                                onetSocCode:
                                    backendCareer
                                        ? backendCareer.onetSocCode
                                        : selectedCareerCode,

                                matchPercentage:
                                    selectedCareerMatch || 0
                            })
                        }
                    );

                    const result =
                        await response.json();

                    if (!result.success) {

                        alert(
                            result.message ||
                            "Unable to save career."
                        );

                        return;
                    }

                    button.textContent = "♥ Saved";

                    button.classList.add("saved");

                }

            } catch (error) {

                console.error(
                    "Save career error:",
                    error
                );

                alert(
                    "Unable to connect to the server."
                );
            }

        }
    );
            /* =========================================
               COMPARE CAREER
            ========================================= */

            document
                .getElementById("compareButton")
                .addEventListener(
                    "click",
                    function() {


                        localStorage.setItem(
                            "careerToCompare",
                            selectedCareer
                        );


                        window.location.href =
                            "./compare-roles.html";

                    }
                );

        }

    </script>
